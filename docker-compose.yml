services:
  # DynamoDB Local: Amazon's DynamoDB, as a program on this machine, for
  # development. The server creates its table here on first start. The data
  # is kept in the volume (-sharedDb: one database, whatever AWS keys and
  # region a client sends). It runs as root only so it can write to the
  # volume, which Docker creates owned by root.
  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    restart: unless-stopped
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data", "-disableTelemetry"]
    ports:
      - "8000:8000"
    volumes:
      - jobdrop_dynamodb_data:/data

  # The backend, built from server/Dockerfile: the REST API plus its two
  # background jobs (job-board sync and email sending) in one container.
  # For day-to-day development, run `npm run dev:server` on the host
  # instead; this is the containerized path, and Docker restarts it if it
  # crashes. DYNAMODB_ENDPOINT uses the "dynamodb" service name: that's the
  # database's address inside Docker's network, not localhost. The server
  # refuses to start without CLERK_SECRET_KEY. Its metrics port (9091) isn't
  # published: only Prometheus, inside Docker's network, reads it.
  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      - dynamodb
    environment:
      DYNAMODB_ENDPOINT: "http://dynamodb:8000"
      DYNAMODB_TABLE: jobdrop
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-WatchmyJob}
    ports:
      - "4000:4000"

  # Monitoring (`npm run monitoring:up`): Prometheus collects the backend's
  # metrics, Grafana draws them. Both are set up from monitoring/.
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Lets Prometheus reach a backend running on this machine (Docker
    # Desktop has this name built in; Linux needs the line).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Local use: anyone who can reach this port may view the dashboards
      # without signing in. Sign in as admin to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/jobdrop.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    # 3000 is the website's dev server.
    ports:
      - "3001:3000"

volumes:
  jobdrop_dynamodb_data:
  prometheus_data:
  grafana_data:
