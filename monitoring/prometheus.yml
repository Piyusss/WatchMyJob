# Prometheus reads ("scrapes") the backend's /metrics every 15 seconds and
# keeps the numbers, so Grafana can draw them over time. The backend serves
# /metrics on its own port, 9091, never on the public API port.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: jobdrop
    static_configs:
      # The backend started with `npm run dev:server` on this machine, as
      # seen from inside Docker.
      - targets: ["host.docker.internal:9091"]
        labels:
          instance: local
      # The backend running in Docker Compose (the api service). Only one
      # of the two is normally up; the other shows as down, which is fine.
      - targets: ["api:9091"]
        labels:
          instance: docker
